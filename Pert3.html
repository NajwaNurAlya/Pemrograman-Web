<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pertemuan 3</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="main-header">
        <h1 class="title">Form Kehadiran</h1>    
    <header>
<div class="container">
    <form acton="#" method="post" target="_blank">
            <label for="nama">Nama:</label>
            <input type="text" placeholder="Masukkan nama">
            <br>
            <br>
            <label for="NPM">NPM:</label>
            <input type="number" placeholder="Masukkan NPM">
            <br>
            <br>
            <label for="kelas">Kelas:</label>
            <select>
                <option value="Pilih kelas">Pilih kelas</option>
                <option value="SI">Sistem Informasi</option>
                <option value="Ilkom">Ilmu Komputer</option>
                <option value="MI">Manajemen Informatika</option>
            </select>
            <br>
            <br>
            <label for="tanggal">Tanggal:</label>
            <input type="date" placeholder="tanggal">
            <br>
            <br>
            <label for="waktu">Waktu:</label>
            <input type="time" placeholder="waktu">
            <br>
            <br>
            <button id="button-submit" type="submit">Submit</button>
            <br>
            
    </form>
    </div>
</body>
</html>
